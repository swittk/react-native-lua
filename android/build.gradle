import groovy.json.JsonSlurper
import java.nio.file.Paths

buildscript {
  if (project == rootProject) {
    repositories {
      google()
      mavenCentral()
      jcenter()
    }
    dependencies {
      classpath "com.android.tools.build:gradle:4.2.0"
    }
  }
}

apply plugin: "com.android.library"

static def findNodeModules(File projectDirectory, File rootDirectory) {
  def configured = System.getenv("REACT_NATIVE_NODE_MODULES_DIR")
  if (configured != null && new File(configured, "react-native/package.json").exists()) {
    return new File(configured).canonicalPath
  }
  // Prefer the consuming app. Local file: installs can otherwise discover a
  // development-only RN version nested inside the copied package checkout.
  def starts = [rootDirectory.toPath().normalize(), projectDirectory.toPath().normalize()]
  for (def start : starts) {
    def current = start
    while (current != null) {
      def candidate = Paths.get(current.toString(), "node_modules")
      if (candidate.resolve("react-native/package.json").toFile().exists()) {
        return candidate.toString()
      }
      current = current.getParent()
    }
  }
  throw new GradleException("react-native-lua: unable to locate react-native in node_modules")
}

def nodeModules = findNodeModules(projectDir, rootProject.projectDir)
def reactNativePackage = new JsonSlurper().parse(file("${nodeModules}/react-native/package.json"))
def reactNativeVersionMatch = reactNativePackage.version =~ /^(\d+)\.(\d+)\.(\d+)/
if (!reactNativeVersionMatch.find()) {
  throw new GradleException(
      "react-native-lua: unable to parse React Native version ${reactNativePackage.version}")
}
def reactNativeMajorVersion = reactNativeVersionMatch.group(1).toInteger()
def reactNativeMinorVersion = reactNativeVersionMatch.group(2).toInteger()
def reactNativePatchVersion = reactNativeVersionMatch.group(3).toInteger()
if (reactNativeMajorVersion == 0 &&
    (reactNativeMinorVersion < 73 ||
        (reactNativeMinorVersion == 73 && reactNativePatchVersion < 6))) {
  throw new GradleException("react-native-lua requires React Native 0.73.6 or newer")
}
def newArchitectureEnabled =
    project.hasProperty("newArchEnabled") && project.property("newArchEnabled") == "true"
def reactNativeArchitectures = project.findProperty("reactNativeArchitectures")

apply plugin: "com.facebook.react"

def selectedReactNativeDir = file("${nodeModules}/react-native")
def nestedCodegenDir = file("${selectedReactNativeDir}/node_modules/@react-native/codegen")
def siblingCodegenDir = new File(
    selectedReactNativeDir.canonicalFile.parentFile,
    "@react-native/codegen")
def topLevelCodegenDir = file("${nodeModules}/@react-native/codegen")
def selectedCodegenDir = nestedCodegenDir.exists()
    ? nestedCodegenDir
    : (siblingCodegenDir.exists() ? siblingCodegenDir : topLevelCodegenDir)

react {
  libraryName = "NativeLuaSpec"
  jsRootDir = file("..")
  reactNativeDir = selectedReactNativeDir
  codegenDir = selectedCodegenDir
  codegenJavaPackageName = "com.reactnativelua"
}

// RN 0.83+ library codegen reads the root privateReact extension. In a normal
// app build the application plugin owns that value; for standalone library
// validation, fill it only when its default codegen path does not exist.
def privateReact = rootProject.extensions.findByName("privateReact")
if (privateReact != null) {
  def rootCodegen = privateReact.codegenDir.orNull?.asFile
  if (rootCodegen == null || !rootCodegen.exists()) {
    privateReact.reactNativeDir.set(selectedReactNativeDir)
    privateReact.codegenDir.set(selectedCodegenDir)
  }
}

def safeExtGet(String name, Object fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "com.reactnativelua"

  compileSdkVersion safeExtGet(
      "Lua_compileSdkVersion", safeExtGet("compileSdkVersion", reactNativeMinorVersion >= 80 ? 35 : 34))
  ndkVersion safeExtGet(
      "Lua_ndkVersion", safeExtGet("ndkVersion", reactNativeMinorVersion >= 80 ? "27.1.12297006" : "25.1.8937393"))

  defaultConfig {
    minSdkVersion safeExtGet(
        "Lua_minSdkVersion", safeExtGet("minSdkVersion", reactNativeMinorVersion >= 80 ? 24 : 21))
    targetSdkVersion safeExtGet(
        "Lua_targetSdkVersion", safeExtGet("targetSdkVersion", reactNativeMinorVersion >= 80 ? 35 : 34))
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", newArchitectureEnabled.toString()

    externalNativeBuild {
      cmake {
        cppFlags "-O2 -frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DNODE_MODULES_DIR=${nodeModules}",
            "-DREACT_NATIVE_MINOR_VERSION=${reactNativeMinorVersion}",
            "-DRNLUA_NEW_ARCH_ENABLED=${newArchitectureEnabled}",
            "-DANDROID_STL=c++_shared"
        if (reactNativeArchitectures != null) {
          abiFilters(*reactNativeArchitectures.split(","))
        } else {
          abiFilters "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
        }
      }
    }
  }

  sourceSets {
    main {
      java.srcDir(newArchitectureEnabled ? "src/newarch/java" : "src/oldarch/java")
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    buildConfig = true
    prefab = true
  }

  // These are link-time Prefab dependencies supplied by the consuming RN app;
  // only libSKRNNativeLua.so belongs in this library's AAR.
  packagingOptions {
    exclude "**/libc++_shared.so"
    exclude "**/libfbjni.so"
    exclude "**/libjsi.so"
    exclude "**/libreactnative.so"
    exclude "**/libreactnativejni.so"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  mavenLocal()
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.facebook.fbjni:fbjni:${safeExtGet('fbjniVersion', reactNativeMinorVersion >= 76 ? '0.7.0' : '0.5.1')}"
}
